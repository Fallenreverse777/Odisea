<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Chat with us</title>
<style>
  :root { --brand:#1f6f5c; --bg:#f6f4ef; --card:#ffffff; --text:#1d2420; --muted:#6b736e; --line:#e4e1d8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; max-width:720px; margin:0 auto; }
  header { padding:16px; padding-top:max(16px, env(safe-area-inset-top)); background:var(--brand); color:#fff; }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; font-size:14px; opacity:.85; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:18px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:6px; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:6px; }
  #chips { display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
  #chips button { border:1px solid var(--brand); color:var(--brand); background:transparent; border-radius:16px;
    padding:6px 12px; font:inherit; font-size:14px; }
  #chips button.main { background:var(--brand); color:#fff; }
  #chips button.urgent { border-color:#c0392b; color:#c0392b; }
  form { display:flex; gap:8px; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--line); }
  input { flex:1; border:1px solid var(--line); outline:0; border-radius:20px; padding:10px 14px; font:inherit; background:var(--bg); }
  button[type=submit] { border:0; border-radius:20px; padding:0 18px; background:var(--brand); color:#fff; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header><h1 id="name">…</h1><p id="about"></p></header>
<div id="log"></div>
<div id="chips"></div>
<form id="form">
  <input id="input" placeholder="Ask us anything…" autocomplete="off" maxlength="500">
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");

// One id per visitor, so a booking conversation isn't mixed up with someone else's.
let session = "";
try { session = sessionStorage.getItem("shadowSession") || ""; } catch {}
if (!session) {
  session = Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  try { sessionStorage.setItem("shadowSession", session); } catch {}
}

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function ask(text) {
  add("user", text);
  send.disabled = true;
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session }) });
    if (!res.ok) throw new Error();
    add("bot", (await res.json()).reply);
  } catch { add("bot", "Sorry, something went wrong. Please try again."); }
  send.disabled = false;
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  ask(text);
});
function chip(label, question, cls = "") {
  const b = document.createElement("button");
  b.type = "button"; b.className = cls; b.textContent = label;
  b.addEventListener("click", () => ask(question || label));
  document.getElementById("chips").append(b);
}

fetch("/api/info").then(r => r.json()).then(info => {
  document.getElementById("name").textContent = info.name;
  document.getElementById("about").textContent = info.about;
  document.title = "Chat with " + info.name;
  if (info.bookings) chip(info.booking_label, "I'd like to book: " + info.booking_label, "main");
  chip("Are you open now?");
  chip("Prices");
  chip(info.service_area ? "Do you cover my area?" : "Where are you?", info.service_area ? "Which areas do you cover?" : "Where are you?");
  chip("Contact");
  if (info.emergencies) chip("⚠️ Emergency", "It's an emergency", "urgent");
  add("bot", `Hi! I'm the assistant for ${info.name}. Ask me about prices, opening hours` +
    (info.bookings ? `, or say “${info.booking_label.toLowerCase()}”` : "") + `. How can I help?`);
});
</script>
</body>
</html>
